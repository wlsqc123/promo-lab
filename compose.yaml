name: settlement-lab
services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: settlement_lab
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: local_lab_admin
      TZ: UTC
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./sql:/lab/sql:ro
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=200ms
      - -c
      - track_io_timing=on
    cpus: 2
    mem_limit: 2g
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lab_admin -d settlement_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
  runner:
    build: .
    environment:
      DATABASE_URL: postgresql://lab_worker:local_lab_worker@db:5432/settlement_lab
      TZ: UTC
    volumes:
      - ./runner:/app/runner:ro
      - ./results:/app/results
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]
    entrypoint: [python, -m, runner]
volumes:
  pgdata:
